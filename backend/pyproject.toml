[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nalam-clinic-backend"
version = "0.1.0"
description = "Nalam Clinic Appointment Booking - backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.1,<3.2",
    "pydantic[email]>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "itsdangerous>=2.2,<2.3",
    "httpx>=0.27,<0.28",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
