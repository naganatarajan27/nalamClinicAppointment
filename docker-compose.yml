services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nalam_clinic
    ports:
      - "5432:5432"
    volumes:
      - nalam_clinic_db:/var/lib/postgresql/data

volumes:
  nalam_clinic_db:
